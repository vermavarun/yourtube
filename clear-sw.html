<!DOCTYPE html>
<html>
<head>
    <title>Clear Service Worker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background: #0051cc;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background: #f0f0f0;
        }
        .success {
            background: #d4edda !important;
            color: #155724;
        }
        .error {
            background: #f8d7da !important;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>Service Worker Manager</h1>
    <p>Use this page to clear and re-register the Service Worker after code changes.</p>

    <button onclick="clearServiceWorker()">Clear Service Worker</button>
    <button onclick="clearStorageAndReload()">Clear Everything & Reload</button>

    <div id="status"></div>

    <script>
        async function clearServiceWorker() {
            const statusDiv = document.getElementById('status');

            try {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();

                    if (registrations.length === 0) {
                        statusDiv.className = 'success';
                        statusDiv.textContent = 'No Service Workers registered.';
                        return;
                    }

                    for (let registration of registrations) {
                        await registration.unregister();
                        console.log('Unregistered:', registration.scope);
                    }

                    statusDiv.className = 'success';
                    statusDiv.textContent = `✓ Cleared ${registrations.length} Service Worker(s). Refresh the page to re-register.`;
                } else {
                    statusDiv.className = 'error';
                    statusDiv.textContent = 'Service Workers not supported in this browser.';
                }
            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = 'Error: ' + error.message;
            }
        }

        async function clearStorageAndReload() {
            const statusDiv = document.getElementById('status');

            try {
                // Clear Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }

                // Clear sessionStorage
                sessionStorage.clear();

                // Clear localStorage
                localStorage.clear();

                statusDiv.className = 'success';
                statusDiv.textContent = '✓ Cleared everything! Reloading in 2 seconds...';

                setTimeout(() => {
                    window.location.href = 'http://localhost:3000';
                }, 2000);

            } catch (error) {
                statusDiv.className = 'error';
                statusDiv.textContent = 'Error: ' + error.message;
            }
        }

        // Show current status on load
        window.addEventListener('load', async () => {
            const statusDiv = document.getElementById('status');

            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                const controller = navigator.serviceWorker.controller;

                statusDiv.textContent = `
Service Workers: ${registrations.length} registered
Controller: ${controller ? 'Active' : 'None'}
sessionStorage items: ${sessionStorage.length}
                `.trim();
            }
        });
    </script>
</body>
</html>
